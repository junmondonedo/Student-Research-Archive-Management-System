<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · SRAMS</title>
    <link rel="icon" href="asset/hnuseal.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="asset/style.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-panel">
        <div class="brand">
          <div class="brand-mark">
            <img src="asset/hnuseal.svg" alt="Holy Name University seal" />
          </div>
          <div>
            <strong>SRAMS</strong>
            <span>Student Research Archive Management System</span>
          </div>
        </div>
        <h1>Sign in to the archive</h1>
        <p class="sub">Holy Name University · Research repository portal</p>
        <div class="field">
          <label for="username">HNU ID number</label>
          <input
            id="username"
            type="text"
            placeholder="Enter your HNU ID number"
            value="06949714"
            autocomplete="username"
          />
          <div class="field-error" id="usernameErr">
            Enter your HNU ID number.
          </div>
        </div>
        <div class="field">
          <label for="pass">Password</label>
          <input
            id="pass"
            type="password"
            value="demopass"
            autocomplete="current-password"
            onkeydown="if (event.key === 'Enter') doLogin();"
          />
          <div class="field-error" id="passErr">Password is required.</div>
        </div>
        <div class="field">
          <label for="roleSelect">Sign in as (demo)</label>
          <select id="roleSelect">
            <option value="librarian.html">Librarian (Admin)</option>
            <option value="program.html">Program Head</option>
            <option value="classadiver.html">Class Adviser</option>
            <option value="techadviser.html">Technical Adviser</option>
            <option value="student.html">Faculty / Student</option>
            <option value="crp.html">
              Center for Research and Publications
            </option>
          </select>
        </div>
        <button class="btn btn-primary" style="width: 100%" onclick="doLogin()">
          Sign in
        </button>
      </div>
      <div class="login-art">
        <img
          class="seal-wm"
          src="asset/hnuseal.svg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="crest"
          src="asset/hnuseal.svg"
          alt="Holy Name University seal"
        />
        <svg
          class="shelves"
          viewBox="0 0 600 800"
          preserveAspectRatio="xMidYMid slice"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <g fill="none" stroke="#2E6B50" stroke-width="2">
            <line x1="0" y1="160" x2="600" y2="160" />
            <line x1="0" y1="320" x2="600" y2="320" />
            <line x1="0" y1="480" x2="600" y2="480" />
            <line x1="0" y1="640" x2="600" y2="640" />
          </g>
          <g fill="#2E6B50">
            <rect x="40" y="70" width="26" height="90" rx="2" />
            <rect x="72" y="86" width="20" height="74" rx="2" />
            <rect x="98" y="60" width="30" height="100" rx="2" />
            <rect x="170" y="78" width="24" height="82" rx="2" />
            <rect x="200" y="66" width="22" height="94" rx="2" />
            <rect x="300" y="82" width="28" height="78" rx="2" />
            <rect x="334" y="70" width="20" height="90" rx="2" />
            <rect x="440" y="76" width="26" height="84" rx="2" />
            <rect x="60" y="236" width="24" height="84" rx="2" />
            <rect x="90" y="222" width="28" height="98" rx="2" />
            <rect x="190" y="240" width="22" height="80" rx="2" />
            <rect x="218" y="228" width="26" height="92" rx="2" />
            <rect x="330" y="234" width="24" height="86" rx="2" />
            <rect x="360" y="220" width="20" height="100" rx="2" />
            <rect x="470" y="238" width="28" height="82" rx="2" />
            <rect x="50" y="392" width="26" height="88" rx="2" />
            <rect x="140" y="380" width="22" height="100" rx="2" />
            <rect x="168" y="398" width="28" height="82" rx="2" />
            <rect x="280" y="386" width="24" height="94" rx="2" />
            <rect x="400" y="394" width="26" height="86" rx="2" />
            <rect x="432" y="382" width="20" height="98" rx="2" />
            <rect x="80" y="552" width="24" height="88" rx="2" />
            <rect x="110" y="540" width="28" height="100" rx="2" />
            <rect x="240" y="556" width="22" height="84" rx="2" />
            <rect x="350" y="544" width="26" height="96" rx="2" />
            <rect x="382" y="558" width="20" height="82" rx="2" />
            <rect x="490" y="548" width="28" height="92" rx="2" />
          </g>
        </svg>
        <blockquote>
          &ldquo;Every study a student finishes deserves a shelf that never runs
          out of space.&rdquo; HNU Center for Research and Publications
        </blockquote>
      </div>
    </div>
    <script>
      function doLogin() {
        var u = document.getElementById("username"),
          p = document.getElementById("pass");
        document.getElementById("usernameErr").style.display = u.value.trim()
          ? "none"
          : "block";
        document.getElementById("passErr").style.display = p.value.trim()
          ? "none"
          : "block";
        if (!u.value.trim() || !p.value.trim()) return;
        window.location.href = document.getElementById("roleSelect").value;
      }
    </script>
  </body>
</html>
